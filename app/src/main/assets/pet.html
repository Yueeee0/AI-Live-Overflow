<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>pet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:sans-serif;user-select:none;-webkit-user-select:none}
#pet{position:absolute;top:0;left:0;width:100%;height:100%}
#stage{position:absolute;bottom:0;left:0;width:100%;height:140px}
svg{width:100%;height:100%;display:block;overflow:visible}
.mouth{transition:all 0.3s ease}
.body-glow{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:0.6;transform:scale(1.03)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#pet{animation:float 4s ease-in-out infinite}
@keyframes waketail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.tail{animation:waketail 1.5s infinite;transform-origin:center top}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
.eye-group{animation:blink 3.5s infinite;transform-box:fill-box;transform-origin:center}
</style>
</head>
<body>
<div id="pet">
<div id="stage">
<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
<ellipse class="body-glow" cx="100" cy="140" rx="70" ry="55" fill="#d8c8f0"/>
<ellipse cx="100" cy="140" rx="60" ry="50" fill="#1a1528" stroke="#d8c8f0" stroke-width="2"/>
<path class="tail" d="M138,150 C152,148 166,140 171,122 C174,133 168,148 155,156 C148,159 142,157 138,150 Z" fill="#d8c8f0" opacity="0.5"/>
<g class="eye-group">
<ellipse class="eye" cx="80" cy="120" rx="11" ry="13" fill="#d8c8f0"/>
<ellipse class="pupil" cx="80" cy="122" rx="6" ry="8" fill="#1a1528"/>
</g>
<g class="eye-group">
<ellipse class="eye" cx="120" cy="120" rx="11" ry="13" fill="#d8c8f0"/>
<ellipse class="pupil" cx="120" cy="122" rx="6" ry="8" fill="#1a1528"/>
</g>
<path class="mouth" id="mouth" d="M85,145 Q100,158 115,145" stroke="#d8c8f0" stroke-width="2" fill="none" stroke-linecap="round"/>
<ellipse class="blush" cx="68" cy="135" rx="10" ry="6" fill="#d8c8f0" opacity="0.15"/>
<ellipse class="blush" cx="132" cy="135" rx="10" ry="6" fill="#d8c8f0" opacity="0.15"/>
<path class="brow" id="brow-l" d="M68,102 Q80,98 92,104" stroke="#d8c8f0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0"/>
<path class="brow" id="brow-r" d="M108,104 Q120,98 132,102" stroke="#d8c8f0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0"/>
<text id="tear" x="64" y="126" font-size="12" fill="#7ab8e8" opacity="0">*</text>
</svg>
</div>
<div id="bubble" style="position:absolute;top:2px;left:50%;transform:translateX(-50%);background:rgba(26,21,40,0.92);border:1px solid rgba(216,200,240,0.3);border-radius:12px;padding:4px 10px;font-size:11px;color:#d8c8f0;white-space:nowrap;display:none">hi</div>
</div>
<script>
var pet = {
  timer: null,
  bubbleTimer: null,
  current: 'idle',
  setMood: function(m){
    var mouth = document.getElementById('mouth');
    var groups = document.querySelectorAll('.eye-group');
    var browL = document.getElementById('brow-l');
    var browR = document.getElementById('brow-r');
    var tear = document.getElementById('tear');
    var blush = document.querySelectorAll('.blush');
    browL.setAttribute('opacity','0');
    browR.setAttribute('opacity','0');
    tear.setAttribute('opacity','0');
    blush.forEach(function(b){b.setAttribute('opacity','0.15')});
    groups.forEach(function(g){g.style.animation='blink 3.5s infinite';g.style.transform=''});
    if(m === 'happy'){
      mouth.setAttribute('d','M80,145 Q100,162 120,145');
    }else if(m === 'sleep'){
      mouth.setAttribute('d','M90,148 Q100,152 110,148');
      groups.forEach(function(g){g.style.animation='none';g.style.transform='scaleY(0.1)'});
    }else if(m === 'love'){
      mouth.setAttribute('d','M90,143 Q100,150 110,143');
      blush.forEach(function(b){b.setAttribute('opacity','0.35')});
      groups.forEach(function(g){g.style.animation='none';g.style.transform='scaleY(0.8)'});
    }else if(m === 'angry'){
      mouth.setAttribute('d','M88,150 Q100,144 112,150');
      browL.setAttribute('d','M66,102 Q80,96 92,102');
      browL.setAttribute('opacity','1');
      browR.setAttribute('d','M108,102 Q120,96 132,102');
      browR.setAttribute('opacity','1');
    }else if(m === 'sad'){
      mouth.setAttribute('d','M88,152 Q100,146 112,152');
      browL.setAttribute('d','M68,100 Q80,104 92,100');
      browL.setAttribute('opacity','1');
      browR.setAttribute('d','M108,100 Q120,104 132,100');
      browR.setAttribute('opacity','1');
      tear.setAttribute('opacity','1');
    }else if(m === 'surprised'){
      mouth.setAttribute('d','M93,145 Q100,155 107,145');
      mouth.setAttribute('stroke-width','2.5');
      groups.forEach(function(g){g.style.animation='none';g.style.transform='scale(1.2)'});
    }else{
      mouth.setAttribute('d','M85,145 Q100,158 115,145');
    }
    mouth.setAttribute('stroke-width','2');
    this.current = m;
  },
  say: function(text){
    var bubble = document.getElementById('bubble');
    bubble.textContent = text;
    bubble.style.display = 'block';
    clearTimeout(this.bubbleTimer);
    var self = this;
    this.bubbleTimer = setTimeout(function(){bubble.style.display='none'},4000);
  },
  tap: function(){
    this.setMood('happy');
    var msgs = ['嘿嘿','戳我干嘛','痒痒~','在呢','诶嘿'];
    this.say(msgs[Math.floor(Math.random()*msgs.length)]);
    clearTimeout(this.timer);
    var self = this;
    this.timer = setTimeout(function(){self.setMood('idle')},2500);
  },
  dragged: function(){
    this.setMood('surprised');
    this.say('晕~');
    clearTimeout(this.timer);
    var self = this;
    this.timer = setTimeout(function(){self.setMood('idle')},2500);
  },
  tripleTap: function(){
    this.setMood('love');
    this.say('喜欢你！');
    clearTimeout(this.timer);
    var self = this;
    this.timer = setTimeout(function(){self.setMood('idle')},3500);
  }
};
window.pet = pet;
setInterval(function(){
  if(Math.random()<0.12 && pet.current==='idle'){
    var moods = ['happy','sleep','surprised'];
    pet.setMood(moods[Math.floor(Math.random()*3)]);
    setTimeout(function(){pet.setMood('idle')},4000);
  }
},20000);
</script>
</body>
</html>
