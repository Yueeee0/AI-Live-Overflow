<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:transparent;
  overflow:hidden;
  font-family:sans-serif;
  user-select:none;
  -webkit-user-select:none;
}
#pet{
  position:absolute;
  bottom:0;left:50%;
  transform:translateX(-50%);
  width:140px;height:155px;
}
svg{width:100%;height:100%;display:block}
.mouth{transition:all 0.3s ease}
.eye{transition:all 0.4s ease}
.body-glow{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{
  0%,100%{opacity:0.3;transform:scale(1)}
  50%{opacity:0.6;transform:scale(1.03)}
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
#pet{animation:float 4s ease-in-out infinite}
@keyframes waketail{
  0%,100%{transform:rotate(-5deg)}
  50%{transform:rotate(5deg)}
}
.tail{animation:waketail 1.5s ease-in-out infinite;transform-origin:center top}
@keyframes blink{
  0%,95%,100%{transform:scaleY(1)}
  97%{transform:scaleY(0.1)}
}
.blink{animation:blink 3.5s infinite}
</style>
